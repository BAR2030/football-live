services:
  - type: web
    name: football-live-miniapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
